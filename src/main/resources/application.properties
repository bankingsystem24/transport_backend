spring.application.name=transport_backend


# Server
server.port=7780

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/transport?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
